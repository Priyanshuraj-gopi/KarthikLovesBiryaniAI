tform commission, labor and overhead. Verify before making business decisions.'},{id:'MET-01',name:'Business measurement definitions',text:'KPI DEFINITIONS\n\nAverage rating is the arithmetic mean of review stars in the selected period. Low-rating share is reviews with 1–3 stars divided by all reviews. Repeat-order share in this demo is repeat-flagged fictional orders divided by orders in that period. The after-intervention cohort is simulated; it is not a controlled experiment and cannot establish causation or actual revenue impact.'}];

function renderDashboard(){let cats=categories.map(c=>[c,reviews.filter(r=>r.period==='current'&&r.rating<=3&&r.category===c).length]).sort((a,b)=>b[1]-a[1]),dishCounts=dishes.map(d=>[d[1],reviews.filter(r=>r.period==='current'&&r.dishId===d[0]&&r.rating<=3).length]).sort((a,b)=>b[1]-a[1]).slice(0,5);let r=subset('current').filter(x=>x.rating<=3).slice(0,5);$('#page-dashboard').innerHTML=`<div class="titlebar"><div><div class="eyebrow">Business overview · synthetic data</div><h1>Good morning, Karthik</h1><p class="sub">A clear view of customer experience and the work that can improve it.</p></div><button class="btn primary" onclick="go('agent')">✳ &nbsp;Ask the agent</button></div><div class="grid kpis"><div class="card"><div class="kpi-label">Current average rating</div><div class="kpi-value">${fmt(periodAvg('current'))}<span style="font-size:15px;color:#b88837"> ★</span></div><div class="kpi-note"><span class="delta">−0.5</span> from historical baseline</div></div><div class="card"><div class="kpi-label">Reviews analysed</div><div class="kpi-value">120</div><div class="kpi-note">Current synthetic sample</div></div><div class="card"><div class="kpi-label">Low rating share</div><div class="kpi-value">${lowPct('current')}%</div><div class="kpi-note">1–3 star reviews in current period</div></div><div class="card"><div class="kpi-label">Repeat order rate</div><div class="kpi-value">${Math.round(orders.filter(x=>x.repeat).length/orders.length*100)}%</div><div class="kpi-note">Illustrative order-level estimate</div></div></div><div class="grid section-grid"><div class="card"><div class="section-head"><div><h2>Rating trend</h2><p class="sub">Calculated directly from synthetic review records</p></div><span class="period-tag">OUT OF 5</span></div><div class="bars">${periods.map(p=>`<div class="barcol"><div class="bar ${p.key}" style="height:${periodAvg(p.key)*20}%"><span class="barval">${fmt(periodAvg(p.key))}</span></div><span class="barlabel">${p.key==='historical'?'Histo function workflow(q){let ret=retrieve(q,8);callTool('fetch_reviews',`${ret.reviews.length} relevant review records`);callTool('classify_customer_complaints','Current period complaint categories');callTool('fetch_orders','Synthetic order context');callTool('knowledge_retrieve',`${ret.docs.length} relevant SOP / business documents`);const metricIntent=/rating|stars|trend|compare|period|repeat order/i.test(q);let relevant=ret.reviews;let bycat={};relevant.forEach(r=>bycat[r.category]=(bycat[r.category]||0)+1);let primary=Object.entries(bycat).sort((a,b)=>b[1]-a[1])[0];const evidence=relevant.slice(0,4).map(r=>`• ${r.id} · ${r.dish} · ${r.rating}★ — “${r.text}”`).join('\n');let doc=ret.docs[0];let answer=metricIntent?`Calculated from the generated review records:\n\n${periods.map(p=>`• ${p.label}: ${fmt(periodAvg(p.key))} stars across ${subset(p.key).length} reviews (${lowPct(p.key)}% rated 1–3)`).join('\n')}\n\nThe post-intervention period is a separate synthetic cohort; the difference does not establish an intervention effect. Repeat-order share is an illustrative synthetic order flag (${Math.round(orders.filter(x=>x.repeat).length/orders.length*100)}% across ${orders.length} orders), not measured customer retention.\n\nSource: generated review and order records. All data is synthetic.`:`I checked ${relevant.length} matching current-period reviews and retrieved business documents.\n\n${primary?`In this retrieved sample, the most common primary theme is ${primary[0]} (${primary[1]} of ${relevant.length}). This is an observed pattern in the sample, not proof of cause.`:'I did not find enough matching review evidence for a reliable category comparison.'}\n\nReview evidence\n${evidence||'No relevant review records matched that question.'}\n\n${doc?`Operational context · ${doc.name} (${doc.id})\n${doc.text.split('\n\n')[1]}`:'No relevant SOP or operating document matched. Treat any causal explanation as unverified.'}\n\nNext step: inspect the cited orders and validate the process with the kitchen team. Any purchase or procedure change should be submitted for owner approval.\n\nSources: ${relevant.map(r=>r.id).join(', ')||'none'}${doc?`; ${doc.id}`:''}. Demo records are synthetic.`;return {answer,ret}}

function resetDemo(){if(!confirm('Reset this demo? This clears saved approvals and audit entries in this browser, then restores the generated records.'))return;localStorage.removeItem('kb-approvals');localStorage.removeItem('kb-audit');sessionStorage.removeItem('kb-correction');approvals=[];audit=[];reviews=makeReviews();demoStep=0;renderDemo();renderNav();showToast('Demo data reset')}
function csvOf(rows){if(!rows.length)return '';const cols=Object.keys(rows[0]);return [cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))].join('\n')}
function dataset(id){const customers=Array.from({length:168},(_,i)=>({customer_id:'CUS'+String(i+1).padStart(3,'0'),anonymised:true,first_order_date:`2026-${String(i%10+1).padStart(2,'0')}-${String(i%27+1).padStart(2,'0')}`,orders_count:2+(i*7)%12,synthetic:true}));const orderRows=orders.map(o=>({...o,delivery_minutes:25+(Number(o.id.slice(3))*13)%40,synthetic:true}));const packaging=[{packaging_id:'PKG01',name:'Vented food-grade PP bowl',unit_cost_inr:12,usage:'Single servings',status:'Current synthetic'}, {packaging_id:'PKG02',name:'Leak-resistant sealed tub',unit_cost_inr:16,usage:'Gravy-rich meals',status:'Trial candidate'}, {packaging_id:'PKG03',name:'Fitted delivery carrier',unit_cost_inr:22,usage:'Delivery orders',status:'Current synthetic'}, {packaging_id:'PKG04',name:'Tamper-evident seal',unit_cost_inr:2,usage:'All delivery orders',status:'Current synthetic'}, {packaging_id:'PKG05',name:'Family meal container',unit_cost_inr:28,usage:'Family portions',status:'Current synthetic'}];const costs=dishes.map((d,i)=>({dish_id:d[0],dish:d[1],selling_price_inr:d[2],estimated_ingredient_cost_inr:Math.round(d[2]*(.31+(i%4)*.035)),estimated_packaging_cost_inr:12+(i%3)*3,synthetic:true}));const interventions=[{id:'INT01',name:'Packaging seal and vent trial',status:'Proposed',period:'post',cost_estimate_inr:4000,actual:false,description:'Illustrative controlled packaging trial.'},{id:'INT02',name:'Dinner dispatch timing review',status:'Simulated',period:'post',cost_estimate_inr:0,actual:false,description:'Synthetic process review scenario.'},{id:'INT03',name:'Portion consistency check',status:'Simulated',period:'post',cost_estimate_inr:0,actual:false,description:'Synthetic kitchen measurement scenario.'}];if(id==='reviews')return {name:'customer_reviews.csv',data:csvOf(reviews.map(r=>({review_id:r.id,customer_id:r.customerId,order_id:r.orderId,review_date:r.date,dish_id:r.dishId,dish_name:r.dish,rating:r.rating,review_text:r.text,primary_complaint:r.category,secondary_complaint:'',sentiment:r.rating>=4?'positive':r.rating===3?'mixed':'negative',delivery_type:r.deliveryType,delivery_minutes:r.deliveryMinutes,order_value_inr:r.orderValue,period:r.period,intervention_associated:r.intervention,synthetic:true})))};if(id==='orders')return {name:'order_history.csv',data:csvOf(orderRows)};if(id==='customers')return {name:'customers.csv',data:csvOf(customers)};if(id==='menu')return {name:'restaurant_menu.csv',data:csvOf(dishes.map(d=>({dish_id:d[0],dish_name:d[1],price_inr:d[2],available:true,synthetic:true})))};if(id==='packaging')return {name:'packaging_information.csv',data:csvOf(packaging)};if(id==='costs')return {name:'ingredient_costs.csv',data:csvOf(costs)};if(id==='interventions')return {name:'intervention_history.csv',data:csvOf(interventions)};if(id==='metrics')return {name:'business_metrics.json',data:JSON.stringify({disclaimer:'All values are synthetic and illustrative, not actual business results.',periods:Object.fromEntries(periods.map(p=>[p.key,{review_count:subset(p.key).length,average_rating:Number(periodAvg(p.key).toFixed(1)),distribution:Object.fromEntries(p.dist),low_rating_share_percent:lowPct(p.key)}])),orders:{count:orders.length,repeat_order_share_percent:Math.round(orders.filter(x=>x.repeat).length/orders.length*100)},generated_at:'At application load'} ,null,2)};return {name:'restaurant_operating_sop.md',data:docs.map(d=>`# ${d.name} (${d.id})\n\n${d.text}`).join('\n\n---\n\n')}}
function downloadDataset(id){const d=dataset(id);download(d.name,d.data,id==='metrics'?'application/json':id==='sops'?'text/markdown':'text/csv')}
function downloadCsv(){downloadDataset('reviews')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function boot(){renderNav();renderDashboard();renderAgent();if(periods.some(p=>periodAvg(p.key)!==({historical:4.3,current:3.8,post:4.1}[p.key])))console.error('Synthetic review distribution failed rating checks');window.downloadCsv=downloadCsv;}
boot();
</script></body></html>
